name: Free homepage connectivity check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-domain.yml'
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]

permissions:
  contents: read
  pages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm the default Pages address
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages-settings.json"
          jq '{status, cname, html_url, https_enforced, source}' "$RUNNER_TEMP/pages-settings.json"
          if ! jq -e '.cname == null or .cname == ""' "$RUNNER_TEMP/pages-settings.json"; then
            echo "::error::Remove the custom domain in repository Settings > Pages to restore the free address."
            exit 1
          fi

      - name: Verify the public homepage
        run: |
          curl --fail --silent --show-error --location --max-redirs 3 --connect-timeout 8 --max-time 30 --retry 2 --retry-delay 10 --dump-header "$RUNNER_TEMP/homepage-headers.txt" --output "$RUNNER_TEMP/homepage.html" --write-out 'HTTP %{http_code}; final URL: %{url_effective}\n' https://algebra-mcx.github.io/
          cat "$RUNNER_TEMP/homepage-headers.txt"
          grep -q 'Chenxi Ma' "$RUNNER_TEMP/homepage.html"
          grep -q 'https://algebra-mcx.github.io/' "$RUNNER_TEMP/homepage.html"
